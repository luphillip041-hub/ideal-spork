name: kraken-copy-bot

on:
  push:
    paths: ["kraken-copy-bot/**", ".github/workflows/copybot.yml"]
  pull_request:
    paths: ["kraken-copy-bot/**", ".github/workflows/copybot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken-copy-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
